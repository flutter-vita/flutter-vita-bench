name: flutter_vita_bench
description: The flutter-vita benchmark. 36 scenes, measured on a PS Vita.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # FlutterVita.info() for the clocks in the result header.
  flutter_vita: ^0.1.1

# Its own slot. The gallery is FVTA00005 and the dev slot FVTA00002, so the
# benchmark, the gallery and an app under work can all be installed at once.
vita:
  title_id: FVTA00006
  name: Vita Bench

flutter:
  uses-material-design: true
